<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 8s ease-in-out infinite;
        }
        .orb-1 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(96,165,250,0.13), transparent 70%);
            top: -100px; left: -100px;
        }
        .orb-2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(139,92,246,0.12), transparent 70%);
            bottom: -80px; right: -80px;
            animation-delay: -4s;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        /* Login card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 48px 44px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            animation: fadeUp 0.7s ease forwards;
        }

        /* Top glow line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(96,165,250,0.6), transparent);
            border-radius: 99px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Icon */
        .login-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, rgba(96,165,250,0.2), rgba(139,92,246,0.2));
            border: 1px solid rgba(96,165,250,0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 24px;
        }

        .login-title {
            font-family: 'Orbitron', monospace;
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        .login-subtitle {
            text-align: center;
            color: rgba(148,163,184,0.7);
            font-size: 13px;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 1px;
            margin-bottom: 36px;
        }

        /* Form group */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: #60a5fa;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 15px;
            opacity: 0.5;
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #f1f5f9;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        .form-group input:focus {
            border-color: rgba(96, 165, 250, 0.5);
            background: rgba(96, 165, 250, 0.07);
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
        }

        /* Login button */
        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 24px rgba(59,130,246,0.35);
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 36px rgba(59,130,246,0.5);
        }

        .login-btn:hover::before { opacity: 1; }

        /* Divider */
        .form-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0 20px;
        }

        .form-divider span {
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .form-divider p {
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            color: rgba(148,163,184,0.5);
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* Register link */
        .register-link {
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            color: rgba(148,163,184,0.6);
        }

        .register-link a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .register-link a:hover {
            color: #a78bfa;
        }

        /* Flash messages */
        .flash {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .flash-error {
            background: rgba(248,113,113,0.1);
            border: 1px solid rgba(248,113,113,0.3);
            color: #f87171;
        }
        .flash-success {
            background: rgba(52,211,153,0.1);
            border: 1px solid rgba(52,211,153,0.3);
            color: #34d399;
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-icon">🧠</div>
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to your AI Detector account</p>

            <!-- Flash messages — keep your existing Flask flash logic here -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrap">
                        <span class="input-icon">👤</span>
                        <input type="text" name="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <span class="input-icon">🔒</span>
                        <input type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">Login →</button>
            </form>

            <div class="form-divider">
                <span></span>
                <p>Don't have an account?</p>
                <span></span>
            </div>

            <div class="register-link">
                <a href="/register">Create an account →</a>
            </div>

        </div>
    </div>
</body>
</html>
